<p>Wyszukiwanie obrazka *.gif</p>
<script>
    let tekst="ikona jest w logo.gif";
    var gifRegex=/\S*\.gif/i
    let position=tekst.search(gifRegex)
    document.writeln(tekst.slice(position));
